[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noise_aware_compilation"
version = "0.1.0"
description = "Noise-aware SWAP-free qubit placement for QEC circuits, built on Nove"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "nove @ git+https://github.com/KUQCI/nove@485b413",
  "numpy>=1.24",
  "pymatching>=2.2",
  "stim>=1.15,<2",
]

[project.optional-dependencies]
report = [
  "matplotlib>=3.7",
]
dev = [
  "matplotlib>=3.7",
  "mypy>=1.10",
  "networkx>=3.0",
  "pytest>=8",
  "qiskit-ibm-runtime==0.50.0",
  "ruff>=0.6",
  "scipy>=1.10",
]

[project.scripts]
nac-benchmark = "noise_aware_compilation.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noise_aware_compilation = ["device_data/*.json", "py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "results: checks on the committed benchmark results files (needs results/runs)",
  "slow: simulation tests taking more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["stim", "pymatching", "networkx", "networkx.*", "scipy", "scipy.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

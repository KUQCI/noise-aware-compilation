[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noise_aware_compilation"
version = "0.2.0"
description = "Noise-aware SWAP-free qubit placement for QEC circuits, built on Nove"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "nove @ git+https://github.com/KUQCI/nove@485b413",
  "numpy>=1.24",
  "pymatching>=2.2",
  "stim>=1.15,<2",
]

[project.optional-dependencies]
# v2 benchmark only (nac_bench/, outside the package): the Qiskit layout baseline (X15)
bench = [
  "matplotlib>=3.7",
  "qiskit==2.5.2",
]
report = [
  "matplotlib>=3.7",
]
dev = [
  "matplotlib>=3.7",
  "mypy>=1.10",
  "networkx>=3.0",
  "pytest>=8",
  "qiskit-ibm-runtime==0.50.0",
  "ruff>=0.6",
  "scipy>=1.10",
]

[project.scripts]
nac = "noise_aware_compilation.cli:main"
nac-benchmark = "noise_aware_compilation.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noise_aware_compilation = ["device_data/*.json", "examples/*.json", "examples/*.stim", "py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "results: checks on the committed benchmark results files (needs results/runs)",
  "slow: simulation tests taking more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "results", "results_v2", "src/noise_aware_compilation/examples/*.json"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", "nac_bench"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["stim", "pymatching", "networkx", "scipy", "matplotlib", "matplotlib.*", "qiskit", "qiskit.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# The report generator writes Unicode typography (−, ×, –) into REPORT.md on purpose.
"src/noise_aware_compilation/report.py" = ["RUF001", "E501"]
"nac_bench/report_v2.py" = ["RUF001", "E501"]
